<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreightGuard Defense — Client Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --surface2:#21262d;
      --border:  #30363d;
      --fg:      #e6edf3;
      --muted:   #7d8590;
      --accent:  #f0b429;
      --blue:    #3a82f6;
      --red:     #f85149;
      --green:   #3fb950;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .logo-area { text-align: center; margin-bottom: 28px; }
    .logo-area .shield { font-size: 44px; margin-bottom: 8px; }
    .logo-area h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    .logo-area h1 span { color: var(--accent); }
    .logo-area p { font-size: 13px; color: var(--muted); margin-top: 5px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 22px;
    }
    .tabs button {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
    }
    .tabs button.active {
      background: var(--surface);
      color: var(--fg);
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }
    input[type=text], input[type=email], input[type=password] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 40px; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: 16px; padding: 0; line-height: 1;
    }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--blue);
      text-decoration: none;
      margin-top: 4px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .forgot-link:hover { text-decoration: underline; }
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary {
      width: 100%;
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: border-color .15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--fg); }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0; color: var(--muted); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .btn-google {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color .15s;
    }
    .btn-google:hover { border-color: var(--accent); }
    .btn-google:disabled { opacity: .5; cursor: not-allowed; }
    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .alert-error   { background: rgba(248,81,73,.1);  border: 1px solid rgba(248,81,73,.3);  color: var(--red); }
    .alert-success { background: rgba(63,185,80,.1);  border: 1px solid rgba(63,185,80,.3);  color: var(--green); }
    .alert-info    { background: rgba(58,130,246,.1); border: 1px solid rgba(58,130,246,.3); color: #7ab7ff; }
    #alert { display: none; }
    .footer-link { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
    .footer-link a { color: var(--blue); text-decoration: none; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,.3); border-top-color: #000;
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="logo-area">
  <div class="shield">⚖️</div>
  <h1>FreightGuard <span>Defense</span></h1>
  <p>Client Portal — Access Your Letters &amp; History</p>
</div>

<div class="card">

  <!-- TAB BAR — hidden on forgot/reset screens -->
  <div id="tabBar" class="tabs">
    <button id="tab-login-btn"    class="active" onclick="showTab('login')">Sign In</button>
    <button id="tab-register-btn"               onclick="showTab('register')">Create Account</button>
  </div>

  <div id="alert"></div>

  <!-- ── LOGIN ── -->
  <div id="form-login">
    <div class="form-group">
      <label>Email</label>
      <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email"
             onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="pw-wrap">
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doLogin()" />
        <button class="pw-toggle" type="button" onclick="togglePw('login-password',this)" tabindex="-1">👁</button>
      </div>
      <button class="forgot-link" onclick="showTab('forgot')">Forgot password?</button>
    </div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()">Sign In</button>
    <div class="divider">or</div>
    <button class="btn-google" id="btn-google-login" onclick="doGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
  </div>

  <!-- ── REGISTER ── -->
  <div id="form-register" style="display:none">
    <div class="form-group">
      <label>Full Name</label>
      <input id="reg-name" type="text" placeholder="Jane Smith" autocomplete="name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="pw-wrap">
        <input id="reg-password" type="password" placeholder="Min 8 characters" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')doRegister()" />
        <button class="pw-toggle" type="button" onclick="togglePw('reg-password',this)" tabindex="-1">👁</button>
      </div>
    </div>
    <button class="btn-primary" id="btn-register" onclick="doRegister()">Create Account</button>
    <div class="divider">or</div>
    <button class="btn-google" id="btn-google-reg" onclick="doGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Sign up with Google
    </button>
  </div>

  <!-- ── FORGOT PASSWORD ── -->
  <div id="form-forgot" style="display:none">
    <p style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6;">
      Enter your email and we'll send a password reset link valid for 1 hour.
    </p>
    <div class="form-group">
      <label>Email Address</label>
      <input id="forgot-email" type="email" placeholder="you@example.com"
             onkeydown="if(event.key==='Enter')doForgotPassword()" />
    </div>
    <button class="btn-primary" id="btn-forgot" onclick="doForgotPassword()">Send Reset Link</button>
    <button class="btn-secondary" onclick="showTab('login')">← Back to Sign In</button>
  </div>

  <!-- ── RESET PASSWORD ── -->
  <div id="form-reset" style="display:none">
    <p style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6;">
      Choose a new password for your account.
    </p>
    <div class="form-group">
      <label>New Password</label>
      <div class="pw-wrap">
        <input id="reset-password" type="password" placeholder="Min 8 characters" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')doResetPassword()" />
        <button class="pw-toggle" type="button" onclick="togglePw('reset-password',this)" tabindex="-1">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input id="reset-confirm" type="password" placeholder="Repeat password"
               onkeydown="if(event.key==='Enter')doResetPassword()" />
      </div>
    </div>
    <button class="btn-primary" id="btn-reset" onclick="doResetPassword()">Set New Password</button>
  </div>

</div>

<div class="footer-link">
  <a href="/">← Back to FreightGuard Defense</a>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
let googleClientId = '';
let resetToken     = '';

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  // Check for password reset token in URL
  const params = new URLSearchParams(window.location.search);
  resetToken = params.get('reset') || '';
  if (resetToken) {
    showTab('reset');
    return;
  }

  // Already logged in?
  const token = localStorage.getItem('fgd_client_token');
  if (token) {
    try {
      const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.ok) { window.location.href = '/portal.html'; return; }
      else         localStorage.removeItem('fgd_client_token');
    } catch {}
  }

  // Load Google Client ID for Sign-In
  try {
    const r  = await fetch('/api/auth/google-client-id');
    const d  = await r.json();
    googleClientId = d.clientId || '';
    if (googleClientId) initGoogleOneTap();
  } catch {}
}

function initGoogleOneTap() {
  // Use the newer credential-based flow (ID token, not access token)
  if (!window.google) return;
  google.accounts.id.initialize({
    client_id:         googleClientId,
    callback:          handleGoogleCredential,
    auto_select:       false,
    cancel_on_tap_outside: true,
  });
}

// ── TAB SWITCHING ─────────────────────────────────────────────
function showTab(tab) {
  ['login','register','forgot','reset'].forEach(t => {
    document.getElementById('form-' + t).style.display = (t === tab) ? '' : 'none';
  });
  const showTabs = ['login','register'].includes(tab);
  document.getElementById('tabBar').style.display = showTabs ? '' : 'none';
  if (showTabs) {
    document.getElementById('tab-login-btn').classList.toggle('active',    tab === 'login');
    document.getElementById('tab-register-btn').classList.toggle('active', tab === 'register');
  }
  hideAlert();
}

// ── HELPERS ───────────────────────────────────────────────────
function showAlert(msg, type = 'error') {
  const el = document.getElementById('alert');
  el.className = 'alert alert-' + type;
  el.innerHTML = msg;
  el.style.display = '';
}
function hideAlert() { document.getElementById('alert').style.display = 'none'; }

function setLoading(ids, loading) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.disabled = loading;
    if (loading) el.dataset.orig = el.innerHTML;
    else if (el.dataset.orig) el.innerHTML = el.dataset.orig;
  });
}

function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') { input.type = 'text';     btn.textContent = '🙈'; }
  else                           { input.type = 'password'; btn.textContent = '👁';  }
}

function saveToken(token) {
  localStorage.setItem('fgd_client_token', token);
}

// ── LOGIN ─────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showAlert('Please enter your email and password.'); return; }
  setLoading(['btn-login','btn-google-login'], true);
  hideAlert();
  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    saveToken(data.token);
    showAlert('✅ Welcome back! Redirecting…', 'success');
    setTimeout(() => { window.location.href = '/portal.html'; }, 700);
  } catch(e) {
    showAlert(e.message);
    setLoading(['btn-login','btn-google-login'], false);
  }
}

// ── REGISTER ──────────────────────────────────────────────────
async function doRegister() {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name || !email || !password) { showAlert('All fields are required.'); return; }
  if (password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }
  setLoading(['btn-register','btn-google-reg'], true);
  hideAlert();
  try {
    const res  = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Registration failed');
    saveToken(data.token);
    showAlert('✅ Account created! Redirecting…', 'success');
    setTimeout(() => { window.location.href = '/portal.html'; }, 700);
  } catch(e) {
    showAlert(e.message);
    setLoading(['btn-register','btn-google-reg'], false);
  }
}

// ── GOOGLE SIGN-IN ────────────────────────────────────────────
function doGoogleSignIn() {
  if (!googleClientId) {
    showAlert('Google Sign-In is not configured. Please use email/password login.');
    return;
  }
  // Trigger Google popup — credential callback fires handleGoogleCredential
  google.accounts.id.prompt((notification) => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      // Fall back to explicit button render popup
      const div = document.createElement('div');
      div.style.display = 'none';
      document.body.appendChild(div);
      google.accounts.id.renderButton(div, {
        type: 'standard', theme: 'outline', size: 'large',
      });
      div.querySelector('[role=button]')?.click();
    }
  });
}

async function handleGoogleCredential(response) {
  // response.credential is a proper Google ID token (JWT)
  try {
    const res  = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Google sign-in failed');
    saveToken(data.token);
    showAlert('✅ Signed in with Google! Redirecting…', 'success');
    setTimeout(() => { window.location.href = '/portal.html'; }, 700);
  } catch(e) {
    showAlert(e.message);
  }
}

// ── FORGOT PASSWORD ───────────────────────────────────────────
async function doForgotPassword() {
  const email = document.getElementById('forgot-email').value.trim();
  if (!email) { showAlert('Please enter your email address.'); return; }
  setLoading(['btn-forgot'], true);
  hideAlert();
  try {
    await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    // Always show success (prevent email enumeration)
    showAlert(
      '📧 If an account exists for <strong>' + email.replace(/</g,'') + '</strong>, a reset link has been sent. Check your inbox (and spam folder).',
      'success'
    );
    document.getElementById('btn-forgot').disabled = true;
  } catch {
    showAlert('Something went wrong. Please try again.');
    setLoading(['btn-forgot'], false);
  }
}

// ── RESET PASSWORD ────────────────────────────────────────────
async function doResetPassword() {
  const password = document.getElementById('reset-password').value;
  const confirm  = document.getElementById('reset-confirm').value;
  if (!password || password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }
  if (password !== confirm)             { showAlert('Passwords do not match.'); return; }
  if (!resetToken)                      { showAlert('Invalid reset link. Please request a new one.'); return; }
  setLoading(['btn-reset'], true);
  hideAlert();
  try {
    const res  = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: resetToken, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Reset failed');
    showAlert('✅ Password updated successfully! Redirecting to sign in…', 'success');
    resetToken = '';
    // Remove token from URL
    history.replaceState({}, '', '/login.html');
    setTimeout(() => showTab('login'), 2000);
  } catch(e) {
    showAlert(e.message);
    setLoading(['btn-reset'], false);
  }
}

init();
</script>
</body>
</html>
